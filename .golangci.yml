version: "2"

linters:
  # please, do not use `enable-all`: it's deprecated and will be removed soon.
  # inverted configuration with `enable-all` and `disable` is not scalable during updates of golangci-lint
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - mnd
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

  # don't enable:
  # - asciicheck
  # - gochecknoglobals
  # - gocognit
  # - godot
  # - godox
  # - goerr113
  # - maligned
  # - nestif
  # - prealloc
  # - testpackage
  # - wsl

  settings:
    depguard:
      rules:
        main:
          deny:
            # logging is allowed only by logutils.Log, logrus
            # is allowed to use only in logutils package
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only by logutils.Log
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
    gocyclo:
      min-complexity: 20 # increased from 15 to get us going, but not make things worse
    mnd:
      # don't include the "operation" and "assign"
      checks: [argument, case, condition, return]
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
    nolintlint:
      allow-unused: false # report any unused nolint directives
      require-explanation: false # don't require an explanation for nolint directives
      require-specific: false # don't require nolint directives to be specific about which linter is being skipped
    revive:
      confidence: 0
    staticcheck:
      checks: [all]

  exclusions:
    generated: lax
    presets: [comments, std-error-handling, common-false-positives, legacy]
    # Excluding configuration per-path, per-linter, per-text and per-source
    rules:
      - path: _test\.go
        linters:
          - mnd
      - path: cmd/ice/cmd
        linters:
          - gochecknoinits
      - path: sizes.go
        linters:
          - gochecknoinits

      # https://github.com/go-critic/go-critic/issues/926
      - linters:
          - gocritic
        text: "unnecessaryDefer:"
    paths:
      - test/testdata_etc
      - internal/cache
      - internal/renameio
      - internal/robustio

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vcaesar/ice
  exclusions:
    generated: lax
    paths:
      - test/testdata_etc
      - internal/cache
      - internal/renameio
      - internal/robustio
